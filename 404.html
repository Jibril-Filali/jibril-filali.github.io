<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Page introuvable</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .e404-wrap {
      min-height: 100svh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      gap: 1.5rem;
    }
    .e404-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 900;
      color: var(--green);
      text-shadow: 0 0 40px rgba(0,255,65,.3);
      line-height: 1;
    }
    .e404-msg {
      font-size: .88rem; color: var(--text-dim);
      max-width: 420px; line-height: 1.7;
    }
    .e404-trace {
      font-size: .72rem; color: var(--text-muted);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      padding: 1rem 1.5rem;
      border-radius: 4px;
      text-align: left;
      max-width: 420px; width: 100%;
    }
    .e404-trace p { margin-bottom: .3rem; }
    .e404-trace .err { color: var(--red); }
    .e404-actions {
      display: flex; flex-wrap: wrap; gap: .75rem;
      justify-content: center;
    }
    .e404-btn {
      font-family: var(--font-mono); font-size: .78rem;
      padding: .55rem 1.2rem;
      border: 1px solid var(--border-bright);
      background: transparent; color: var(--green);
      border-radius: 3px; cursor: pointer;
      transition: background .2s, box-shadow .2s;
      text-decoration: none;
    }
    .e404-btn:hover {
      background: rgba(0,255,65,.06);
      box-shadow: 0 0 12px rgba(0,255,65,.15);
    }
    .e404-btn.secondary {
      border-color: var(--border); color: var(--text-dim);
    }
  </style>
</head>
<body>

  <canvas id="matrix-canvas"></canvas>
  <div class="scanline"></div>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <div class="e404-wrap">
    <div class="e404-code">404</div>

    <div class="e404-trace">
      <p><span class="prompt">~$</span> GET <span style="color:var(--cyan)" id="e404Path">/???</span></p>
      <p class="err">Error: ENOENT — No such file or directory</p>
      <p style="color:var(--text-muted)">at Router.resolve (portfolio.js:404)</p>
      <p style="color:var(--text-muted)">at window.location.href</p>
    </div>

    <p class="e404-msg">
      La page que tu cherches n'existe pas.<br>
      Elle a peut-être été déplacée, supprimée, ou tu t'es trompé de chemin.
    </p>

    <div class="e404-actions">
      <a href="index.html" class="e404-btn">[ ← Retour accueil ]</a>
      <a href="projects.html" class="e404-btn secondary">[ ./projects ]</a>
      <a href="contact.html" class="e404-btn secondary">[ ./contact ]</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/script.js"></script>
  <script>
    const p = document.getElementById('e404Path');
    if (p) p.textContent = window.location.pathname || '/???';
  </script>
</body>
</html>
